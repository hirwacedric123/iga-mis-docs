# IGA LMS — MIS partner API documentation (GitHub Pages)
site_name: IGA LMS — MIS Documentation
site_description: MIS integration guide — student professionalism export (Kepler College)
site_author: Kepler College / IGA LMS

site_url: https://hirwacedric123.github.io/iga-mis-docs/

repo_name: hirwacedric123/iga-mis-docs
repo_url: https://github.com/hirwacedric123/iga-mis-docs
edit_uri: edit/main/docs/partner/

docs_dir: docs/partner
site_dir: site

# ReadTheDocs theme: plain HTML/CSS, no JavaScript required (loads on slow networks)
theme:
  name: readthedocs
  navigation_depth: 3
  collapse_navigation: false
  titles_only: false

plugins:
  - include-markdown

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - fenced_code

nav:
  - Home: index.md
  - Student professionalism export: mis-professionalism-export.md
